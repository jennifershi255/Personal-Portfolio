name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.4.0"

      # 3. Terraform Init & Apply (root folder)
      - name: Terraform Apply
        id: terraform
        run: |
          terraform init
          terraform apply -auto-approve

      # 4. Capture Terraform Outputs as environment variables
      - name: Set Terraform outputs as env
        run: |
          echo "AWS_REGION=$(terraform output -raw aws_region)" >> $GITHUB_ENV
          echo "ECR_REPOSITORY=$(terraform output -raw ecr_repository)" >> $GITHUB_ENV
          echo "S3_BUCKET=$(terraform output -raw s3_bucket)" >> $GITHUB_ENV
          echo "ECS_CLUSTER=$(terraform output -raw ecs_cluster)" >> $GITHUB_ENV
          echo "ECS_SERVICE=$(terraform output -raw ecs_service)" >> $GITHUB_ENV
          echo "CLOUDFRONT_DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_ENV

      # 5. Authenticate with AWS
      - name: Configure AWS Credentials
        if: false
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 6. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 7. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 8. Build assets
      - name: Build project
        run: npm run build

      # 9. Push assets to S3
      - name: Deploy to S3
        if: false
        run: |
          aws s3 sync dist/ s3://${{ env.S3_BUCKET }} --delete --cache-control "public, max-age=31536000, immutable"

      # 10. Login to Amazon ECR
      - name: Login to Amazon ECR
        if: false
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 11. Build Docker image
      - name: Build Docker image
        if: false
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # 12. Push Docker image to ECR
      - name: Push Docker image to ECR
        if: false
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # 13. Deploy to ECS Fargate
      - name: Deploy to ECS Fargate
        if: false
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      # 14. Invalidate CloudFront cache
      - name: Invalidate CloudFront Cache
        if: false
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
          echo "CloudFront cache invalidated"

      # 15. Output image details
      - name: Output image details
        if: false
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Image pushed to: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Latest tag: $ECR_REGISTRY/$ECR_REPOSITORY:latest"
